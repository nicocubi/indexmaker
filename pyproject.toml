[project]
name = "indexmaker"
version = "0.1.0"
description = ""
authors = [
    {name = "nsoler",email = "nicocubi@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pdfplumber (>=0.11.9,<0.12.0)",
    "python-docx (>=1.2.0,<2.0.0)",
    "nltk (>=3.9.2,<4.0.0)",
    "docx2pdf (>=0.1.8,<0.2.0)"
]

[tool.poetry]
packages = [{include = "indexmaker", from = "src"}]

[tool.poetry.scripts]
indexmaker = "indexmaker.indexmaker_gui:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
